[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jazav/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jazav"]

[tool.hatch.build.targets.sdist]
exclude = ["pixi.lock", "tests", "examples", ".github", ".pre-commit-config.yaml"]

[project]
name = "jazav"
dynamic = ["version"]
description = "Virtual OME-Zarr: a zarr v3 codec that references pixels in the original microscopy files"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Cerrone", email = "lorenzo.cerrone@uzh.ch" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["zarr>=3.2.1"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
examples = [
    "ngio>=1.1.3,<1.3",
    "tifffile",
    "liffile",
    "czifile",
    "nd2>=0.12",
    "numcodecs",
]
dev = [
    "ruff>=0.16,<0.17", # keep in sync with .pre-commit-config.yaml
    "ty",
    "typos",
    "prek",             # drop-in pre-commit replacement
    "ipython",
]

[project.urls]
repository = "https://github.com/lorenzocerrone/jazav"
changelog = "https://github.com/lorenzocerrone/jazav/blob/main/CHANGELOG.md"

[project.scripts]
jazav = "jazav._cli:main"

# zarr discovers codecs by name through this entry-point group; the key must equal
# the codec "name" written into zarr.json. Reinstall after editing it: editable
# installs bake entry_points.txt at install time.
[project.entry-points."zarr.codecs"]
"jazav.reference" = "jazav._codec:ReferenceCodec"

# ---------------------------------------------------------------------------
# pixi
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
jazav = { path = ".", editable = true }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.zarr-floor.pypi-dependencies]
zarr = "==3.2.1"

[tool.pixi.feature.zarr-latest.pypi-dependencies]
zarr = ">=3.4"

# napari + napari-ome-zarr (through ome-zarr-py) read a virtual OME-Zarr like any
# other once jazav is installed; this env is for checking that interactively.
[tool.pixi.feature.napari.dependencies]
napari = ">=0.6"
pyqt6 = ">=6.7"  # napari >= 0.6 needs Qt 6.7; conda-forge "pyqt" is PyQt5
napari-ome-zarr = ">=0.7"
ty = "*"

[tool.pixi.environments]
default = { features = ["py313", "zarr-latest"], solve-group = "latest" }
latest = { features = ["test", "py313", "zarr-latest"], solve-group = "latest" }
floor = { features = ["test", "py312", "zarr-floor"], solve-group = "floor" }
dev = { features = ["dev", "test", "examples", "py313", "zarr-latest"], solve-group = "latest" }
napari = { features = ["napari", "examples", "test", "py313", "zarr-latest"], solve-group = "napari" }

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.dev.tasks]
ruff-fix-imports = "ruff check --select I --fix"
ruff = { cmd = "ruff format", depends-on = ["ruff-fix-imports"] }
lint = "prek run --all-files"
# napari_view.py imports napari, which only the napari environment has.
typecheck = "ty check src examples --exclude examples/napari_view.py"
test-floor = "pixi run -e floor test"
test-latest = "pixi run -e latest test"
test-all = { depends-on = ["test-floor", "test-latest"] }
chores = { depends-on = ["ruff", "test-all", "lint", "typecheck"] }

[tool.pixi.feature.napari.tasks]
# Build the TIFF example, then open its virtual OME-Zarr in napari.
napari-tiff = { cmd = "python examples/napari_view.py _examples_out/tiff_grid/tiff/virtual.zarr", depends-on = ["example-tiff"] }
test-napari = "pytest tests/test_napari.py --no-cov"
typecheck-napari = "ty check --python .pixi/envs/napari examples/napari_view.py"

[tool.pixi.feature.examples.tasks]
example-tiff = "python examples/tiff_grid.py"
example-lif = "python examples/leica_lif.py"
example-czi = "python examples/zeiss_czi.py"
example-nd2 = "python examples/nikon_nd2.py"
example-all = { depends-on = ["example-tiff", "example-lif", "example-czi", "example-nd2"] }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood
    "D415", # First line should end with a period
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 89

[tool.ty.environment]
python = ".pixi/envs/dev"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--color=yes", "--cov", "--cov-report=term-missing"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.run]
source = ["jazav"]
